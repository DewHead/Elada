output: dist/
publishers: []
distributors:
  - name: macos
    build_args:
      release: true
    artifacts:
      - name: dmg
        config:
          background: null
          icon: null
          icon_size: 128
          window:
            position: { x: 400, y: 400 }
            size: { width: 540, height: 380 }
          contents:
            - { x: 448, y: 170, type: link, path: /Applications }
            - { x: 92, y: 170, type: file }
